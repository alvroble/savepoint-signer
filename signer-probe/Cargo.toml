[package]
name = "signer-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bitcoin = { version = "0.32.7", default-features = false, features = ["secp-lowmemory"] }
bip39 = { version = "2.2", default-features = false, features = ["zeroize"] }
qrcodegen = { version = "=1.8.0", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[dev-dependencies]
embedded-sdmmc = { version = "=0.8.0", default-features = false }
