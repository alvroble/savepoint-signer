name: Draft Savepoint Signer release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    runs-on: ubuntu-latest
    container:
      image: shilga/rp2350-croco-cartridge-devcontainer-rust:v0.3
    steps:
      - uses: actions/checkout@v4
      - name: Build and package source and firmware
        shell: sh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="${RELEASE_TAG#v}"
          version="${version%%-*}"
          IFS=. read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<EOF
          $version
          EOF
          export VERSION_MAJOR VERSION_MINOR VERSION_PATCH RELEASE_TYPE=R
          sh scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: savepoint-signer-release
          path: |
            target/release/*.tar.gz
            target/release/SHA256SUMS
  draft:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: savepoint-signer-release
          path: release
      - uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: true
          files: release/*
