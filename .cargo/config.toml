
[build]
# Set the default target to match the Cortex-M33 in the RP2350
target = "thumbv8m.main-none-eabihf"

# The FPU is enabled by default, and float function arguments use FPU
# registers.
[target.thumbv8m.main-none-eabihf]

# Pass extra rustc options, some of which are forwarded to the linker.
#
# * --nmagic turns off page alignment of sections (saves flash)
# * -Tlink.x is cortex-m-rt's linker script (it INCLUDEs memory.x from
#   the package root)
# * -Tdefmt.x is required for defmt
#
# These flags belong here so a standalone checkout of this tree builds
# with `cargo build --release`.
#
# Nested checkouts can merge parent `.cargo/config.toml` flags and pass
# linker scripts twice. `scripts/build-release.sh` overrides that merge.
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "target-cpu=cortex-m33",
]

# Use picotool for loading.
#
# Load an elf, skipping unchanged flash sectors, verify it, and execute it
runner = "picotool load -u -v -x -t elf"

[env]
DEFMT_LOG = "debug"
VERSION_MAJOR = "255"
VERSION_MINOR = "255"
VERSION_PATCH = "255"
RELEASE_TYPE = "U"

[profile.release]
debug = 2

[profile.debug]
debug = 2
